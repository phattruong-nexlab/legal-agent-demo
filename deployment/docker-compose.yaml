version: "3.9"

# Production-like compose: builds the same images used in Cloud Run.
# Run from repo root:  docker compose -f deployment/docker-compose.yaml up --build
services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: legal-agent-backend
    ports:
      - "8000:8080"
    env_file:
      - ../.env
    environment:
      - PORT=8080
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: legal-agent-frontend
    ports:
      - "8501:8080"
    env_file:
      - ../.env
    environment:
      - PORT=8080
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
